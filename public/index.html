<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDAP Management Toolkit</title>
    <link rel="stylesheet" href="/css/daisyui.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl" href="/">GDAP Management Toolkit</a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1 gap-1">
                <li><a id="nav-customers" class="menu-active" onclick="showView('customers')">Customers</a></li>
                <li><a id="nav-relationships" onclick="showView('relationships')">Relationships</a></li>
            </ul>
        </div>
    </div>

    <main class="mx-auto w-full max-w-5xl p-4">

        <div id="loading" class="flex justify-center py-16">
            <span class="loading loading-spinner loading-lg"></span>
        </div>

        <div id="error" class="alert alert-error hidden" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span id="error-text"></span>
        </div>

        <section id="view-customers" class="hidden">
            <label class="input w-full mb-4">
                <svg class="h-4 w-4 opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
                <input id="search-customers" type="search" class="grow" placeholder="Kunden suchen …">
            </label>
            <div id="list-customers" class="space-y-2"></div>
        </section>

        <section id="view-relationships" class="hidden">
            <label class="input w-full mb-4">
                <svg class="h-4 w-4 opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
                <input id="search-relationships" type="search" class="grow" placeholder="Relationships suchen …">
            </label>
            <div id="list-relationships" class="space-y-2"></div>
        </section>

    </main>

    <footer class="footer footer-center p-4 opacity-60">
        <p>GDAP Management Toolkit by robinkiefer2001</p>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
