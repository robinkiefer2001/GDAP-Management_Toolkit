<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers – GDAP Management Toolkit</title>

    <link rel="stylesheet" href="/css/daisyui.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-base-200">

    <main class="mx-auto w-full max-w-7xl p-4">

        <header class="mb-6">
            <h1 class="text-3xl font-bold">Customers</h1>

            <p class="mt-2 text-sm opacity-70">
                Kunden durchsuchen und ihre GDAP-Beziehungen auswerten.
            </p>
        </header>

        <div id="loading" class="flex items-center justify-center gap-3 py-16">
            <span class="loading loading-spinner loading-lg"></span>
            <span>Daten werden geladen …</span>
        </div>

        <div id="error" class="alert alert-error hidden" role="alert">
            <span id="error-text"></span>
        </div>

        <section id="content" class="hidden">

            <!-- Suche -->
            <div class="mb-3 grid grid-cols-1 gap-3 sm:grid-cols-2">

                <label class="input w-full">
                    <span class="text-sm opacity-60">Kunde</span>

                    <input id="search-customers" type="search" class="grow" placeholder="Name oder Tenant-ID …"
                        aria-label="Kunde nach Name oder Tenant-ID suchen">
                </label>

                <label class="input w-full">
                    <span class="text-sm opacity-60">Beziehung</span>

                    <input id="search-relationships" type="search" class="grow" placeholder="Name oder Beziehungs-ID …"
                        aria-label="Beziehung nach Name oder ID suchen">
                </label>

            </div>

            <!-- Filter -->
            <div class="mb-3 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">

                <select id="filter-status" class="select w-full" aria-label="Beziehungsstatus">
                    <option value="">Alle Status</option>
                    <option value="active">Active</option>
                    <option value="expired">Expired</option>
                    <option value="terminated">Terminated</option>
                    <option value="created">Created</option>
                    <option value="approvalpending">Approval pending</option>
                    <option value="approved">Approved</option>
                    <option value="activating">Activating</option>
                    <option value="terminating">Terminating</option>
                </select>

                <select id="filter-auto-extend" class="select w-full" aria-label="Auto-Extend">
                    <option value="">Auto-Extend: alle</option>
                    <option value="enabled">Auto-Extend: aktiviert</option>
                    <option value="disabled">Auto-Extend: deaktiviert</option>
                </select>

                <select id="filter-presence" class="select w-full" aria-label="Vorhandene Beziehungen">
                    <option value="">Alle Kunden</option>
                    <option value="with">Mit Beziehungen</option>
                    <option value="without">Ohne Beziehungen</option>
                </select>

                <select id="sort-customers" class="select w-full" aria-label="Sortierung">
                    <option value="name-asc">Kundenname A–Z</option>
                    <option value="name-desc">Kundenname Z–A</option>
                    <option value="relationships-desc">
                        Meiste passende Beziehungen
                    </option>
                </select>

            </div>

            <div class="mb-4 flex flex-wrap items-center justify-between gap-2">

                <span id="customer-results" class="text-sm opacity-60" role="status" aria-live="polite"></span>

                <button id="reset-customer-filters" type="button" class="btn btn-ghost btn-sm">
                    Filter zurücksetzen
                </button>

            </div>

            <div id="list-customers" class="space-y-2"></div>

        </section>

    </main>

    <script src="/js/layout.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/customers.js"></script>

</body>

</html>
