<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Build – GDAP Management Toolkit</title>

    <link rel="stylesheet" href="/css/daisyui.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-base-200">

    <main class="mx-auto w-full max-w-5xl p-4">

        <div class="mb-4">
            <h1 class="text-2xl font-bold">Build</h1>
            <p class="mt-1 text-sm opacity-60">
                Neue GDAP-Beziehung erstellen und zur Kundenfreigabe einreichen.
                Es wird keine E-Mail versendet.
            </p>
        </div>

        <!-- Wird bei einem Fehler angezeigt. -->
        <div id="buildError" class="alert alert-error mb-4 hidden" role="alert"></div>

        <!-- Wird nach erfolgreicher Erstellung angezeigt. -->
        <div id="buildSuccess" class="alert alert-success mb-4 hidden" role="status"></div>

        <form id="relationshipForm" novalidate>

            <div class="mb-4 rounded-box border border-base-300 bg-base-100 p-4">

                <h2 class="mb-3 font-semibold">Beziehung</h2>

                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">

                    <div>
                        <label for="displayName" class="mb-1 block text-xs opacity-60">
                            Name der Beziehung
                        </label>

                        <input
                            id="displayName"
                            type="text"
                            class="input w-full"
                            placeholder="z. B. Contoso-Admin-2026"
                            maxlength="50"
                            required
                            autocomplete="off"
                        >
                    </div>

                    <div>
                        <label for="customerSearch" class="mb-1 block text-xs opacity-60">
                            Bekannten Kunden suchen
                        </label>
                        <input id="customerSearch" type="search" class="input mb-2 w-full" placeholder="Kundenname oder Tenant-ID" autocomplete="off">
                        <label for="customerSelect" class="mb-1 block text-xs opacity-60">Kunde auswählen</label>
                        <select id="customerSelect" class="select mb-2 w-full" disabled>
                            <option value="">Kunden werden geladen …</option>
                        </select>
                        <div id="customerStatus" class="mb-2 text-xs opacity-60" role="status"></div>
                        <button id="reloadCustomers" type="button" class="btn btn-ghost btn-sm mb-2">Kunden neu laden</button>
                        <label for="tenantId" class="mb-1 block text-xs opacity-60">
                            Customer-Tenant-ID (auch manuell möglich)
                        </label>

                        <input
                            id="tenantId"
                            type="text"
                            class="input w-full"
                            placeholder="00000000-0000-0000-0000-000000000000"
                            pattern="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
                            title="GUID im Format 00000000-0000-0000-0000-000000000000"
                            required
                            autocomplete="off"
                        >
                    </div>

                    <div>
                        <label for="duration" class="mb-1 block text-xs opacity-60">
                            Laufzeit in Tagen (1–730)
                        </label>

                        <input
                            id="duration"
                            type="number"
                            class="input w-full"
                            min="1"
                            max="730"
                            step="1"
                            value="730"
                            required
                        >
                    </div>

                    <div>
                        <label for="autoExtend" class="mb-1 block text-xs opacity-60">
                            Auto-Extend
                        </label>

                        <select id="autoExtend" class="select w-full">
                            <option value="P180D" selected>Automatisch um 180 Tage verlängern</option>
                            <option value="PT0S">Keine automatische Verlängerung</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="mb-4 rounded-box border border-base-300 bg-base-100 p-4">

                <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
                    <h2 class="font-semibold">Rollen</h2>

                    <button id="reloadRoles" type="button" class="btn btn-ghost btn-sm">
                        Neu laden
                    </button>
                </div>

                <label class="input mb-3 w-full">
                    <svg
                        class="h-4 w-4 shrink-0 opacity-50"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
                        />
                    </svg>

                    <input
                        id="roleSearch"
                        type="search"
                        class="grow"
                        placeholder="Rollen nach Name, Beschreibung oder ID durchsuchen …"
                        aria-label="Rollen durchsuchen"
                        autocomplete="off"
                    >
                </label>

                <p id="roleHelp" class="mb-3 text-sm opacity-60">Rollen zwischen den Listen ziehen oder mit den Buttons hinzufügen und entfernen.</p>
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <section class="rounded-box border border-base-300 p-3">
                        <h3 class="mb-2 font-medium">Verfügbare Rollen</h3>
                        <div id="roleList" class="grid min-h-32 max-h-96 gap-2 overflow-y-auto" role="list" aria-label="Verfügbare Rollen" aria-describedby="roleHelp">
                            Rollen werden geladen …
                        </div>
                    </section>
                    <section class="rounded-box border border-base-300 p-3">
                        <h3 class="mb-2 font-medium">Ausgewählte Rollen</h3>
                        <div id="selectedRoleList" class="grid min-h-32 max-h-96 gap-2 overflow-y-auto" role="list" aria-label="Ausgewählte Rollen" aria-describedby="roleHelp"></div>
                    </section>
                </div>

                <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
                    <span id="roleCount" class="text-sm opacity-60" role="status"></span>

                    <button id="createButton" type="submit" class="btn btn-primary" disabled>
                        Create GDAP Relationship
                    </button>
                </div>

            </div>

        </form>

    </main>

    <script src="/js/layout.js"></script>
    <script src="/js/build.js"></script>

</body>

</html>
